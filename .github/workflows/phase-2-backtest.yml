name: Phase 2 - NIFTY ratio backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First expiry date to include (YYYY-MM-DD)"
        required: true
        default: "2025-08-29"
      end:
        description: "Last expiry date to include (YYYY-MM-DD)"
        required: true
        default: "2026-09-30"
      dte_mode:
        description: "DTE interpretation"
        required: true
        type: choice
        options:
          - calendar4
          - sessions4
        default: calendar4
      target_fraction:
        description: "Profit target as fraction of theoretical maximum"
        required: true
        default: "0.95"
      lot_size:
        description: "Historical NIFTY lot size; 0 outputs point P&L only"
        required: true
        default: "0"
      brokerage:
        description: "Paytm Money brokerage per executed order"
        required: true
        default: "10"
      exchange_rate:
        description: "Exchange turnover rate as decimal"
        required: true
      sebi_rate:
        description: "SEBI turnover rate as decimal"
        required: true
      stamp_rate:
        description: "Stamp duty rate on buy premium as decimal"
        required: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-1m-${{ inputs.start }}-${{ inputs.end }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download selected NIFTY data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --out data/raw
      - name: Run tests
        run: pytest -q
      - name: Run backtest
        run: >-
          python scripts/run_backtest.py
          --data data/raw
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --dte-mode "${{ inputs.dte_mode }}"
          --target-fraction "${{ inputs.target_fraction }}"
          --lot-size "${{ inputs.lot_size }}"
          --brokerage "${{ inputs.brokerage }}"
          --exchange-rate "${{ inputs.exchange_rate }}"
          --sebi-rate "${{ inputs.sebi_rate }}"
          --stamp-rate "${{ inputs.stamp_rate }}"
          --out artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-backtest-results
          path: artifacts/