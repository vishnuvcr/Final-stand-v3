name: Phase 6 - flatline tolerance robustness

on:
  push:
    branches: [phase-2-data-backtest]
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      START: "2025-09-02"
      END: "2026-08-04"
      DTE_MODE: "sessions4"
      LOT_SIZE: "0"
      BROKERAGE: "10"
      SLIPPAGE: "0.05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-1m-${{ env.START }}-${{ env.END }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download selected NIFTY data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_hf.py --start "${START}" --end "${END}" --out data/raw
      - name: Run tests
        run: pytest -q
      - name: Run tolerance sweep
        run: |
          for T in 0.02 0.05 0.10; do
            mkdir -p "artifacts/tol_${T}"
            python scripts/run_backtest.py               --data data/raw               --start "${START}"               --end "${END}"               --dte-mode "${DTE_MODE}"               --flatline-tolerance "${T}"               --lot-size "${LOT_SIZE}"               --brokerage "${BROKERAGE}"               --stt 0.001               --exchange-rate 0.0003553               --sebi-rate 0.000001               --stamp-rate 0.00003               --gst-rate 0.18               --slippage-points "${SLIPPAGE}"               --out "artifacts/tol_${T}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-flatline-robustness
          path: artifacts/
